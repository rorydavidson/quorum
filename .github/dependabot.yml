version: 2
updates:
  # pnpm workspace — one PR per group so the noise stays manageable.
  # Security advisories always get their own PR regardless of grouping.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /apps/bff
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
